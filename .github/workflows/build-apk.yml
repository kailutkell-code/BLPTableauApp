name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android Pakete installieren
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android Projekt automatisch finden
        shell: bash
        run: |
          echo "Suche settings.gradle..."

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FEHLER: Im gesamten Repository wurde keine settings.gradle gefunden."
            echo ""
            echo "Vorhandene Dateien:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "Android Projekt gefunden:"
          echo "$GRADLE_ROOT"

          echo "GRADLE_ROOT=$GRADLE_ROOT" >> "$GITHUB_ENV"

      - name: APK bauen
        shell: bash
        run: |
          cd "$GRADLE_ROOT"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK finden
        shell: bash
        run: |
          echo "Suche erzeugte APK..."

          APK_PATH="$(find "$GRADLE_ROOT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "FEHLER: Build lief durch, aber es wurde keine APK gefunden."
            exit 1
          fi

          echo "APK gefunden:"
          echo "$APK_PATH"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/Butz-Konfigurator.apk"

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Butz-Konfigurator-APK
          path: Butz-Konfigurator.apk
          if-no-files-found: error
          retention-days: 30
