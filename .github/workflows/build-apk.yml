name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;34.0.0

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Projekt prüfen
        shell: bash
        run: |
          echo "Repository:"
          ls -la

          if [ ! -f "settings.gradle" ]; then
            echo "FEHLER: settings.gradle fehlt im Hauptordner."
            exit 1
          fi

          if [ ! -f "build.gradle" ]; then
            echo "FEHLER: build.gradle fehlt im Hauptordner."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "FEHLER: app/build.gradle fehlt."
            exit 1
          fi

      - name: APK bauen
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK vorbereiten
        shell: bash
        run: |
          echo "Erzeugte APK-Dateien:"
          find app/build/outputs -type f -name "*.apk" -print

          APK_PATH="$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "FEHLER: Keine APK gefunden."
            exit 1
          fi

          cp "$APK_PATH" Butz-Konfigurator.apk

          echo "APK erfolgreich erstellt:"
          ls -lh Butz-Konfigurator.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Butz-Konfigurator-APK
          path: Butz-Konfigurator.apk
          if-no-files-found: error
          retention-days: 30
